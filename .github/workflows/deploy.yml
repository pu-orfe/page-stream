name: Deploy (GitOps)

on:
  workflow_dispatch:
    inputs:
      recreate_from_scratch:
        description: 'Force stop and recreate the entire stack from scratch (causes brief downtime)'
        required: false
        type: boolean
        default: false

jobs:
  deploy:
    name: Build & Deploy Stack
    runs-on:
      - self-hosted
      - orfe
    
    # Map secrets to job-level environment variables to safely use them in step-level 'if' conditions
    env:
      ORFE_SUBMODULE_SSH_KEY_VAL: ${{ secrets.ORFE_SUBMODULE_SSH_KEY }}
    
    steps:
    # 1. Pre-flight dependency check
    - name: Verify Host Dependencies
      run: |
        echo "=== PRE-FLIGHT DEPENDENCY CHECK ==="
        
        # Check Git
        if ! command -v git &> /dev/null; then
          echo "::error::[PRE-FLIGHT FAILED] 'git' is not installed or not in the PATH on the runner host."
          exit 1
        fi
        echo "✓ Git is installed."
        
        # Check Docker CLI
        if ! command -v docker &> /dev/null; then
          echo "::error::[PRE-FLIGHT FAILED] Docker CLI is not installed or not in the PATH on the runner host."
          echo "Please install Docker on this host machine."
          exit 1
        fi
        echo "✓ Docker CLI is installed."
        
        # Check if Docker daemon is running
        if ! docker info &> /dev/null; then
          echo "::error::[PRE-FLIGHT FAILED] Docker daemon is not running."
          echo "Please start the Docker service or application (e.g., Docker Desktop) on the host machine."
          exit 1
        fi
        echo "✓ Docker daemon is running."
        
        # Check Docker Compose (modern v2 command or legacy v1 script)
        COMPOSE_FOUND=false
        if docker compose version &> /dev/null; then
          echo "✓ Found modern 'docker compose'."
          COMPOSE_FOUND=true
        elif command -v docker-compose &> /dev/null; then
          echo "✓ Found legacy 'docker-compose'."
          COMPOSE_FOUND=true
        fi
        
        if [ "$COMPOSE_FOUND" = "false" ]; then
          echo "::error::[PRE-FLIGHT FAILED] Neither 'docker compose' nor 'docker-compose' was found on the runner host."
          echo "Please install Docker Compose on the host machine."
          exit 1
        fi
        echo "==================================="

    # 2. Checkout repository and handle submodules
    - name: Checkout Repository (with Submodules via SSH Key)
      if: env.ORFE_SUBMODULE_SSH_KEY_VAL != ''
      uses: actions/checkout@v4
      with:
        ssh-key: ${{ secrets.ORFE_SUBMODULE_SSH_KEY }}
        submodules: recursive

    - name: Checkout Repository (Standard)
      if: env.ORFE_SUBMODULE_SSH_KEY_VAL == ''
      uses: actions/checkout@v4

    # Use the dynamic -c flag configuration on the git command to translate submodule URL to HTTPS on-the-fly
    - name: Initialize Submodules (fallback using HTTPS)
      if: env.ORFE_SUBMODULE_SSH_KEY_VAL == ''
      run: |
        git -c url.https://github.com/.insteadOf=git@github.com: submodule update --init --recursive

    # 3. Reconstruct environment secrets & copy local overrides
    # Since the runner operates on your local host, we copy your active host .env and .env.secrets.sh configs (ignored by git)
    # directly into the runner's workspace to ensure 100% parity with your working local setup.
    - name: Configure Ingest Secrets & Environment Overrides
      run: |
        echo "=== RECONSTRUCTING ENVIRONMENT ==="
        
        # 1. Copy the active .env file from your primary host project folder
        if [ -f "/Users/publicdisplays/Downloads/page-stream/.env" ]; then
          echo "✓ Copying live .env file from host to runner workspace"
          cp "/Users/publicdisplays/Downloads/page-stream/.env" .env
        else
          echo "⚠ No host .env found, using defaults"
        fi
        
        # 2. Copy the active secrets from your primary host project folder
        if [ -f "/Users/publicdisplays/Downloads/page-stream/.env.secrets.sh" ]; then
          echo "✓ Copying live .env.secrets.sh file from host to runner workspace"
          cp "/Users/publicdisplays/Downloads/page-stream/.env.secrets.sh" .env.secrets.sh
        else
          echo "⚠ No host .env.secrets.sh found, falling back to GitHub secrets..."
          if [ -n "${{ secrets.ENV_SECRETS_SH }}" ]; then
            echo "Writing .env.secrets.sh from ENV_SECRETS_SH repository secret..."
            echo "${{ secrets.ENV_SECRETS_SH }}" > .env.secrets.sh
          else
            echo "Reconstructing .env.secrets.sh from individual repository secrets..."
            echo '#!/bin/bash' > .env.secrets.sh
            echo "export STANDARD_1_INGEST='${{ secrets.STANDARD_1_INGEST }}'" >> .env.secrets.sh
            echo "export STANDARD_2_INGEST='${{ secrets.STANDARD_2_INGEST }}'" >> .env.secrets.sh
            echo "export STANDARD_3_INGEST='${{ secrets.STANDARD_3_INGEST }}'" >> .env.secrets.sh
            echo "export STANDARD_4_INGEST='${{ secrets.STANDARD_4_INGEST }}'" >> .env.secrets.sh
            echo "export STANDARD_5_INGEST='${{ secrets.STANDARD_5_INGEST }}'" >> .env.secrets.sh
            echo "export STANDARD_6_INGEST='${{ secrets.STANDARD_6_INGEST }}'" >> .env.secrets.sh
            echo "export COMPOSITOR_INGEST='${{ secrets.COMPOSITOR_INGEST }}'" >> .env.secrets.sh
          fi
        fi
        chmod +x .env.secrets.sh
        echo "==================================="

    # 4. Build & Deploy using Docker Compose (Idempotent updates or forced recreation)
    - name: Build and Update Docker Compose Stack
      run: |
        COMPOSE_CMD="docker compose"
        if command -v docker-compose &> /dev/null; then
          COMPOSE_CMD="docker-compose"
        fi
        
        echo "Using compose command: $COMPOSE_CMD"
        
        if [ "${{ github.event.inputs.recreate_from_scratch }}" = "true" ]; then
          echo "=== FORCED RECREATION REQUESTED ==="
          echo "Stopping and tearing down existing stack..."
          $COMPOSE_CMD -f docker-compose.stable.yml down --remove-orphans
          
          echo "Building and starting fresh stack from scratch..."
          source .env.secrets.sh && $COMPOSE_CMD -f docker-compose.stable.yml up -d --build
        else
          echo "=== IDEMPOTENT UPDATE ==="
          echo "Updating and rebuilding modified services in-place..."
          source .env.secrets.sh && $COMPOSE_CMD -f docker-compose.stable.yml up -d --build --remove-orphans
        fi

    # 5. Verify deployment health
    - name: Verify Stack Health
      run: |
        echo "Waiting 25 seconds for services to stabilize (allows Chrome & FFmpeg to boot)..."
        sleep 25
        
        COMPOSE_CMD="docker compose"
        if command -v docker-compose &> /dev/null; then
          COMPOSE_CMD="docker-compose"
        fi
        
        echo "=== Container Status ==="
        $COMPOSE_CMD -f docker-compose.stable.yml ps
        
        # Filter containers belonging to the project and check status
        # We exclude 'requirements-check' from the list of failed/stopped containers because it's a one-shot container designed to exit(0)
        CONTAINERS_NOT_RUNNING=$(docker ps -a --filter "label=com.docker.compose.project=page-stream" --filter "status=exited" --filter "status=dead" --filter "status=restarting" --format "{{.Names}}" | grep -v "requirements-check" || true)
        
        if [ -n "$CONTAINERS_NOT_RUNNING" ]; then
          echo "::error::[DEPLOYMENT UNHEALTHY] One or more Docker containers are not running successfully!"
          echo "Logs of failing/stopped containers:"
          docker ps -a --filter "label=com.docker.compose.project=page-stream"
          exit 1
        fi
        echo "All stack containers are successfully running."
